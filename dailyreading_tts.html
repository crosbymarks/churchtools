<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Catholic Readings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions for toggles and buttons */
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <div class="max-w-3xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-900 mb-2">Daily Catholic Readings</h1>
            <p class="text-gray-600" id="current-date-display">Loading date...</p>
        </header>

        <!-- Navigation and Controls -->
        <div class="bg-white rounded-xl shadow-md p-4 sm:p-6 mb-6">
            
            <!-- Date Selector -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
                <button id="prev-btn" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 font-medium w-full sm:w-auto transition-all">
                    &larr; Previous
                </button>
                
                <input type="date" id="date-picker" class="px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-auto">
                
                <button id="next-btn" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 font-medium w-full sm:w-auto transition-all">
                    Next &rarr;
                </button>
            </div>

            <hr class="border-gray-200 mb-6">

            <!-- Playback & View Toggles -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                
                <!-- Toggle: Full vs Gospel -->
                <div class="flex items-center space-x-3">
                    <span class="text-sm font-medium text-gray-700">Full Readings</span>
                    <button id="view-toggle" class="relative inline-flex h-6 w-11 items-center rounded-full bg-gray-300 transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        <span id="toggle-knob" class="inline-block h-4 w-4 transform rounded-full bg-white transition-all translate-x-1"></span>
                    </button>
                    <span class="text-sm font-medium text-gray-700">Gospel Only</span>
                </div>

                <!-- TTS Controls -->
                <div class="flex space-x-3">
                    <button id="play-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium shadow transition-all flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
                        Play
                    </button>
                    <button id="stop-btn" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded font-medium shadow-sm transition-all flex items-center disabled:opacity-50" disabled>
                        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 3h14v14H3V3z" clip-rule="evenodd"></path></svg>
                        Stop
                    </button>
                </div>
            </div>
        </div>

        <!-- Readings Container -->
        <main id="readings-container" class="bg-white rounded-xl shadow-md p-6 sm:p-8 space-y-8">
            <div class="animate-pulse flex space-x-4">
                <div class="flex-1 space-y-4 py-1">
                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                    <div class="space-y-2">
                        <div class="h-4 bg-gray-200 rounded"></div>
                        <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                    </div>
                </div>
            </div>
        </main>

        <div class="text-center mt-6">
            <a id="usccb-link" href="#" target="_blank" class="text-blue-600 hover:text-blue-800 text-sm font-medium transition-all">
                View this date on USCCB website &rarr;
            </a>
        </div>
    </div>

    <script>
        // State management
        let currentDate = new Date();
        let currentReadings = [];
        let isGospelOnly = false;
        let speechSynth = window.speechSynthesis;
        
        // DOM Elements
        const datePicker = document.getElementById('date-picker');
        const dateDisplay = document.getElementById('current-date-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const viewToggle = document.getElementById('view-toggle');
        const toggleKnob = document.getElementById('toggle-knob');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const container = document.getElementById('readings-container');
        const usccbLink = document.getElementById('usccb-link');

        // Initialize Application
        function init() {
            updateDateUI();
            fetchAndDisplayReadings();
            
            // Event Listeners
            datePicker.addEventListener('change', (e) => {
                // Adjust for timezone offset to prevent date shifting
                const [year, month, day] = e.target.value.split('-');
                currentDate = new Date(year, month - 1, day);
                handleDateChange();
            });
            
            prevBtn.addEventListener('click', () => {
                currentDate.setDate(currentDate.getDate() - 1);
                handleDateChange();
            });
            
            nextBtn.addEventListener('click', () => {
                currentDate.setDate(currentDate.getDate() + 1);
                handleDateChange();
            });

            viewToggle.addEventListener('click', () => {
                isGospelOnly = !isGospelOnly;
                
                // Animate toggle switch
                if (isGospelOnly) {
                    viewToggle.classList.replace('bg-gray-300', 'bg-blue-600');
                    toggleKnob.classList.replace('translate-x-1', 'translate-x-6');
                } else {
                    viewToggle.classList.replace('bg-blue-600', 'bg-gray-300');
                    toggleKnob.classList.replace('translate-x-6', 'translate-x-1');
                }
                
                stopAudio();
                renderReadings();
            });

            playBtn.addEventListener('click', playAudio);
            stopBtn.addEventListener('click', stopAudio);
        }

        function handleDateChange() {
            stopAudio();
            updateDateUI();
            fetchAndDisplayReadings();
        }

        function updateDateUI() {
            // Format for display (e.g., "Saturday, August 23, 2026")
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateDisplay.textContent = currentDate.toLocaleDateString('en-US', options);

            // Format for input (YYYY-MM-DD)
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            const day = String(currentDate.getDate()).padStart(2, '0');
            const dateString = `${year}-${month}-${day}`;
            datePicker.value = dateString;

            // Format for USCCB fallback link (MMDDYY)
            const usccbMonth = String(currentDate.getMonth() + 1).padStart(2, '0');
            const usccbDay = String(currentDate.getDate()).padStart(2, '0');
            const usccbYear = String(currentDate.getFullYear()).slice(-2);
            usccbLink.href = `https://bible.usccb.org/bible/readings/${usccbMonth}${usccbDay}${usccbYear}.cfm`;
        }

        async function fetchAndDisplayReadings() {
            container.innerHTML = '<p class="text-center text-gray-500">Fetching readings...</p>';
            const dateStr = datePicker.value; // YYYY-MM-DD
            
            try {
                // Attempting to fetch from an API utilizing the RC tradition flag
                // Note: URL is a placeholder for a functional API like lectio-api
                const response = await fetch(`https://api.lectionary.org/v1/readings?date=${dateStr}&tradition=rc`);
                
                if (!response.ok) throw new Error("API Network response was not ok");
                
                const data = await response.json();
                currentReadings = processApiData(data);
            } catch (error) {
                console.warn("Live API unavailable or CORS restricted. Falling back to mock data.", error);
                currentReadings = getMockData(dateStr);
            }

            renderReadings();
        }

        function renderReadings() {
            container.innerHTML = '';
            
            const readingsToDisplay = isGospelOnly 
                ? currentReadings.filter(r => r.type.toLowerCase() === 'gospel')
                : currentReadings;

            if (readingsToDisplay.length === 0) {
                container.innerHTML = '<p class="text-center text-red-500">No readings available for this selection.</p>';
                return;
            }

            readingsToDisplay.forEach(reading => {
                const article = document.createElement('article');
                article.className = 'border-b border-gray-100 last:border-0 pb-6 last:pb-0';
                
                const title = document.createElement('h2');
                title.className = 'text-xl font-bold text-gray-800 uppercase tracking-wide mb-1';
                title.textContent = reading.type;

                const citation = document.createElement('h3');
                citation.className = 'text-md font-semibold text-blue-600 mb-3';
                citation.textContent = reading.citation;

                const textBlock = document.createElement('p');
                textBlock.className = 'text-gray-700 leading-relaxed whitespace-pre-line text-lg';
                
                // Implement missing text logic
                if (!reading.text || reading.text.trim() === "") {
                    textBlock.innerHTML = `<span class="italic text-gray-500">[Reading Text not Available]</span>`;
                    // Assign a spoken fallback string so the TTS knows what to say
                    reading.spokenText = `${reading.citation}. Reading text not available.`;
                } else {
                    textBlock.textContent = reading.text;
                    reading.spokenText = reading.text;
                }

                article.appendChild(title);
                article.appendChild(citation);
                article.appendChild(textBlock);
                container.appendChild(article);
            });
        }

        function playAudio() {
            stopAudio();
            
            const readingsToSpeak = isGospelOnly 
                ? currentReadings.filter(r => r.type.toLowerCase() === 'gospel')
                : currentReadings;

            let fullSpeechText = "";
            
            readingsToSpeak.forEach(reading => {
                // Add natural pauses using punctuation
                fullSpeechText += `${reading.type}. ${reading.citation}. ${reading.spokenText} ... `;
            });

            const utterance = new SpeechSynthesisUtterance(fullSpeechText);
            
            // Adjust voice settings for better readability
            utterance.rate = 0.9; 
            utterance.pitch = 1.0;

            utterance.onstart = () => {
                playBtn.disabled = true;
                playBtn.classList.add('opacity-50');
                stopBtn.disabled = false;
                stopBtn.classList.remove('opacity-50');
            };

            utterance.onend = resetAudioButtons;
            utterance.onerror = resetAudioButtons;

            speechSynth.speak(utterance);
        }

        function stopAudio() {
            if (speechSynth.speaking) {
                speechSynth.cancel();
            }
            resetAudioButtons();
        }

        function resetAudioButtons() {
            playBtn.disabled = false;
            playBtn.classList.remove('opacity-50');
            stopBtn.disabled = true;
            stopBtn.classList.add('opacity-50');
        }

        // Mock data generator for fallback
        function getMockData(dateStr) {
            // We intentionally leave the text for the Second Reading empty 
            // to demonstrate the requested missing-text logic.
            return [
                {
                    type: 'First Reading',
                    citation: 'Isaiah 2:1-5',
                    text: 'This is what Isaiah, son of Amoz, saw concerning Judah and Jerusalem. In days to come, the mountain of the LORD’s house shall be established as the highest mountain and raised above the hills. All nations shall stream toward it; many peoples shall come and say: "Come, let us climb the LORD’s mountain, to the house of the God of Jacob, that he may instruct us in his ways, and we may walk in his paths." For from Zion shall go forth instruction, and the word of the LORD from Jerusalem. He shall judge between the nations, and impose terms on many peoples. They shall beat their swords into plowshares and their spears into pruning hooks; one nation shall not raise the sword against another, nor shall they train for war again. O house of Jacob, come, let us walk in the light of the Lord!'
                },
                {
                    type: 'Responsorial Psalm',
                    citation: 'Psalm 122:1-2, 3-4, 4-5',
                    text: 'R. Let us go rejoicing to the house of the Lord.\n\nI rejoiced because they said to me, "We will go up to the house of the LORD." And now we have set foot within your gates, O Jerusalem.\n\nR. Let us go rejoicing to the house of the Lord.'
                },
                {
                    type: 'Second Reading',
                    citation: 'Romans 13:11-14',
                    text: '' // Deliberately blank to trigger the "[Reading Text not Available]" logic
                },
                {
                    type: 'Gospel',
                    citation: 'Matthew 24:37-44',
                    text: 'Jesus said to his disciples: "As it was in the days of Noah, so it will be at the coming of the Son of Man. In those days before the flood, they were eating and drinking, marrying and giving in marriage, up to the day that Noah entered the ark. They did not know until the flood came and carried them all away. So will it be also at the coming of the Son of Man. Two men will be out in the field; one will be taken, and one will be left. Two women will be grinding at the mill; one will be taken, and one will be left. Therefore, stay awake! For you do not know on which day your Lord will come. Be sure of this: if the master of the house had known the hour of night when the thief was coming, he would have stayed awake and not let his house be broken into. So too, you also must be prepared, for at an hour you do not expect, the Son of Man will come."'
                }
            ];
        }

        // Run setup on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
